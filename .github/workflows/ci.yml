name: CI

# Lightweight CPU-only checks. Never downloads checkpoints, never needs Kaggle
# credentials. GPU-tier and weights-tier tests are auto-skipped (see tests/conftest.py).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only torch, the package and parity references
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,hf]"  # hf: transformers for parity tests (no model downloads)
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Environment check
        run: python scripts/check_env.py
      - name: Pytest (CPU tier)
        run: pytest

  cpp:
    name: C++20 (CMake + CTest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and test
        run: bash scripts/build_cpp.sh
